# SPA server. edge (nginx) is the only public ingress; this container is
# reachable only as web-admin-ui:8080 inside openroute-net.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker healthcheck only; not exposed by edge.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed asset names, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Never cache the SPA shell: a deploy must be visible immediately.
    location = /index.html {
        expires -1;
    }

    # Client-side routes (/login, /admin/*) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Проект зафиксирован, чтобы имена контейнеров/сети не зависели от имени каталога.
name: openroute

# Все Docker-сети создаются этим файлом автоматически: пользователю не нужно
# выполнять `docker network create` или подключать контейнеры вручную. Наружу
# открыт только edge; каждый внутренний сервис подключён только к тем сетям,
# которые ему действительно нужны (описание — в блоке `networks` внизу).

services:
  # --- edge: ЕДИНСТВЕННАЯ точка входа (API Gateway-паттерн) ---
  # Наружу (0.0.0.0:${OPENROUTE_EDGE_PORT:-53202}) торчит только nginx;
  # gateway, web-admin и web-admin-ui прячутся в docker-сети, их порты хосту не
  # публикуются. /internal/* наружу не маршрутизируется вообще.
  # Хост-порт настраивается через OPENROUTE_EDGE_PORT (по умолчанию 53202;
  # NVRoute занимает 53201) — оба стека работают одновременно.
  edge:
    build: ./edge
    image: openroute-edge
    ports:
      - "${OPENROUTE_EDGE_PORT:-53202}:8000"
    restart: unless-stopped
    init: true
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - net
    depends_on:
      gateway:
        condition: service_healthy
      web-admin:
        condition: service_started
      web-admin-ui:
        condition: service_healthy

  # --- PostgreSQL: база storage-service (proxies/keys/affinity/personas/лог).
  # Только приватная internal-сеть openroute-storage-db-net; порт наружу НЕ
  # публикуется. Gateway к базе не подключён даже на уровне сети: единственный
  # клиент — storage-service. Данные — в томе pgdata.
  postgres:
    image: postgres:17-alpine
    container_name: openroute-postgres
    environment:
      POSTGRES_USER: openroute
      POSTGRES_PASSWORD: openroute  # только внутри openroute-storage-db-net; поменяйте при необходимости
      POSTGRES_DB: openroute
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    init: true
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openroute -d openroute"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - storage_db_net

  # --- storage-service: единственный компонент, который ходит в PostgreSQL.
  # Домены (proxies/keys/affinity/personas/лог запросов) отдаются gateway по
  # HTTP без токена: сервис доступен только в приватной internal-сети
  # openroute-storage-api-net. Контейнер openroute-storage = DNS-имя в этой
  # сети (STORAGE_SERVICE_URL=http://openroute-storage:8000).
  # Вторая сеть — openroute-storage-db-net — только до PostgreSQL. Хост-порт
  # НЕ публикуется, edge его не маршрутизирует: наружу сервис недоступен.
  storage-service:
    build: ./storage-service
    image: openroute-storage
    container_name: openroute-storage
    env_file:
      - ./storage-service/.env
    environment:
      # Единственное место в compose, где фигурирует DSN: в
      # openroute-storage-db-net хост postgres вместо localhost из
      # storage-service/.env (тот — для запуска без Docker). Gateway этот DSN
      # не получает никогда.
      POSTGRES_DSN: postgresql://openroute:openroute@postgres:5432/openroute
    restart: unless-stopped
    # Стримов нет; 30с хватает, чтобы закрыть пул соединений.
    stop_grace_period: 30s
    init: true
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на старт БД и первое применение схемы (DB_STARTUP_TIMEOUT_SECONDS=15).
      start_period: 20s
    networks:
      - storage_api_net
      - storage_db_net
    # Стартуем только после готовности postgres: /health делает SELECT 1,
    # а схема применяется при первом подключении.
    depends_on:
      postgres:
        condition: service_healthy

  # --- Redis: хранилище сессий web-admin. Только приватная internal-сеть
  # openroute-redis-net (с web-admin); порт наружу НЕ публикуется. AOF
  # (everysec) + том: сессии переживают рестарт. allkeys-lru: при нехватке
  # памяти выгоняются старейшие ключи (только сессии), Redis не падает.
  redis:
    image: redis:7-alpine
    container_name: openroute-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped
    init: true
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - redis_net

  # --- шлюз OpenRoute: data plane (/v1/*, /health, /docs)
  # + internal API (/internal/*, X-Internal-Token) для web-admin ---
  # Сети: openroute-net (edge -> /v1 и web-admin -> /internal),
  # openroute-storage-api-net (клиент storage-service) и openroute-px6-net
  # (список/покупка прокси). PostgreSQL и Redis шлюзу недоступны на уровне сети.
  gateway:
    build: .
    image: openroute-gateway
    # .env даёт только настройки шлюза: DSN PostgreSQL в нём нет и быть не
    # должно — gateway общается с базой исключительно через storage-service.
    env_file:
      - .env
    restart: unless-stopped
    # UPSTREAM_TIMEOUT=300: стримы дорабатывают до конца до SIGKILL
    # (дефолт Docker — всего 10с); in-flight записи лога уходят в
    # storage-service по HTTP и тоже успевают доехать (bounded drain в
    # RequestLog.close(), затем закрытие HTTP-клиента).
    stop_grace_period: 320s
    init: true
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
      - storage_api_net
      - px6_net
    # Порядок старта: сначала px6 (шлюз тянет из него список прокси) и
    # storage-service (всё хранилище: прокси, ключи, affinity, personas, лог).
    # Gateway к postgres напрямую не подключён и не должен: DSN знает только
    # storage-service. /health у px6 не ходит в апстрим, так что condition
    # безопасен; если px6 всё же упал — шлюз ретраит фетч через
    # PROXY_RETRY_SECONDS.
    depends_on:
      px6:
        condition: service_healthy
      storage-service:
        condition: service_healthy

  # --- web-admin: control plane (JSON API /api/admin/* + сессии в Redis).
  # Данными владеет шлюз; сюда ходит через его internal API с общим секретом.
  # Сети: openroute-net (edge -> /api/admin) и openroute-redis-net (сессии).
  # К storage-service и PostgreSQL не подключён.
  # Имя сервиса = DNS-имя в сети (web-admin:8000); на него ссылается
  # upstream в edge/nginx.conf — не переименовывать в одну сторону.
  web-admin:
    build: ./web-admin
    image: openroute-web-admin
    env_file:
      - ./web-admin/.env
    restart: unless-stopped
    init: true
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
      - redis_net
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- web-admin-ui: React SPA (статика nginx), отдельный контейнер.
  # Секретов не получает: браузер ходит за данными в web-admin через edge.
  # Имя сервиса = DNS-имя (web-admin-ui:8080) для upstream в edge/nginx.conf.
  web-admin-ui:
    build: ./web-admin-ui
    image: openroute-web-admin-ui
    restart: unless-stopped
    init: true
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    # nginx-unprivileged слушает 8080 и работает от uid 101; capabilities не нужны.
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - net

  px6:
    build: ./px6-service
    image: openroute-px6
    # container_name задаёт DNS-имя в сети: шлюз ходит по
    # PROXIES_URL=http://openroute-px6:8000/proxies — не переименовывать.
    # Сеть openroute-px6-net: только gateway и px6; отсюда нужен выход в
    # px6.net, поэтому сеть не internal.
    # Имя уникально для всего docker-демона и не конфликтует с NVRoute
    # (у того контейнер прокси-сервиса называется proxy6-service).
    container_name: openroute-px6
    env_file:
      - ./px6-service/.env
    # Хост-порт НЕ публикуем: /proxies отдаёт креды прокси в открытом виде.
    # Debug: docker run --rm --network openroute-px6-net curlimages/curl \
    #   http://openroute-px6:8000/proxies
    restart: unless-stopped
    init: true
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - px6_net

networks:
  # Все сети — проектные (НЕ external) и создаются этим compose-файлом.
  # Пользователю не нужно ничего создавать вручную; имена уникальны и не
  # пересекаются с NVRoute.

  # Входной контур: edge + gateway + web-admin + web-admin-ui. Не internal,
  # потому что edge публикует хост-порт, а gateway ходит в интернет
  # (opencode.ai и апстрим-прокси).
  net:
    name: openroute-net

  # gateway -> storage-service. Internal: сеть без default route, поэтому
  # storage-service не ходит наружу; gateway использует её только для storage.
  storage_api_net:
    name: openroute-storage-api-net
    internal: true

  # storage-service -> PostgreSQL. Gateway сюда не подключён, поэтому не может
  # достучаться до базы даже при компрометации.
  storage_db_net:
    name: openroute-storage-db-net
    internal: true

  # web-admin <-> Redis. Redis доступен только web-admin, не edge/gateway.
  redis_net:
    name: openroute-redis-net
    internal: true

  # gateway <-> px6-service. Не internal: px6-service должен ходить в px6.net.
  px6_net:
    name: openroute-px6-net

volumes:
  # Данные PostgreSQL (именованный том — переживает пересоздание контейнера
  # и `docker compose down`; удаляется только командой `down -v`).
  pgdata:
  # AOF Redis: сессии админки переживают рестарт контейнера Redis.
  redisdata:

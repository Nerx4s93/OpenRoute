# Проект зафиксирован, чтобы имена контейнеров/сети не зависели от имени каталога.
name: openroute

services:
  # --- edge: ЕДИНСТВЕННАЯ точка входа (API Gateway-паттерн) ---
  # Наружу (0.0.0.0:${OPENROUTE_EDGE_PORT:-53202}) торчит только nginx;
  # gateway, web-admin и web-admin-ui прячутся в docker-сети, их порты хосту не
  # публикуются. /internal/* наружу не маршрутизируется вообще.
  # Хост-порт настраивается через OPENROUTE_EDGE_PORT (по умолчанию 53202;
  # NVRoute занимает 53201) — оба стека работают одновременно.
  edge:
    build: ./edge
    image: openroute-edge
    ports:
      - "${OPENROUTE_EDGE_PORT:-53202}:8000"
    restart: unless-stopped
    init: true
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - net
    depends_on:
      gateway:
        condition: service_healthy
      web-admin:
        condition: service_started
      web-admin-ui:
        condition: service_healthy

  # --- PostgreSQL: база storage-service (proxies/keys/affinity/personas/лог).
  # В приватной сети openroute-net; порт наружу НЕ публикуется (как у px6).
  # Gateway к базе не подключается: единственный клиент — storage-service.
  # Данные — в именованном томе pgdata (переживает пересоздание контейнера).
  postgres:
    image: postgres:17-alpine
    container_name: openroute-postgres
    environment:
      POSTGRES_USER: openroute
      POSTGRES_PASSWORD: openroute  # только внутри openroute-net; поменяйте при необходимости
      POSTGRES_DB: openroute
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    init: true
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openroute -d openroute"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - net

  # --- storage-service: единственный компонент, который ходит в PostgreSQL.
  # Домены (proxies/keys/affinity/personas/лог запросов) отдаются gateway по
  # HTTP с X-Storage-Token. Контейнер openroute-storage = DNS-имя в сети
  # (STORAGE_SERVICE_URL=http://openroute-storage:8000). Хост-порт НЕ
  # публикуется, edge его не маршрутизирует: наружу сервис недоступен.
  storage-service:
    build: ./storage-service
    image: openroute-storage
    container_name: openroute-storage
    env_file:
      - ./storage-service/.env
    environment:
      # Единственное место в compose, где фигурирует DSN: внутри сети хост
      # postgres вместо localhost из storage-service/.env (тот — для запуска
      # без Docker). Gateway этот DSN не получает никогда.
      POSTGRES_DSN: postgresql://openroute:openroute@postgres:5432/openroute
    restart: unless-stopped
    # Стримов нет; 30с хватает, чтобы закрыть пул соединений.
    stop_grace_period: 30s
    init: true
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на старт БД и первое применение схемы (DB_STARTUP_TIMEOUT_SECONDS=15).
      start_period: 20s
    networks:
      - net
    # Стартуем только после готовности postgres: /health делает SELECT 1,
    # а схема применяется при первом подключении.
    depends_on:
      postgres:
        condition: service_healthy

  # --- Redis: хранилище сессий web-admin. В приватной сети openroute-net;
  # порт наружу НЕ публикуется. AOF (everysec) + том: сессии переживают
  # рестарт. allkeys-lru: при нехватке памяти выгоняются старейшие ключи
  # (только сессии), Redis не падает.
  redis:
    image: redis:7-alpine
    container_name: openroute-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped
    init: true
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - net

  # --- шлюз OpenRoute: data plane (/v1/*, /health, /docs)
  # + internal API (/internal/*, X-Internal-Token) для web-admin ---
  gateway:
    build: .
    image: openroute-gateway
    # .env даёт только настройки шлюза: DSN PostgreSQL в нём нет и быть не
    # должно — gateway общается с базой исключительно через storage-service.
    env_file:
      - .env
    restart: unless-stopped
    # UPSTREAM_TIMEOUT=300: стримы дорабатывают до конца до SIGKILL
    # (дефолт Docker — всего 10с); in-flight записи лога уходят в
    # storage-service по HTTP и тоже успевают доехать (bounded drain в
    # RequestLog.close(), затем закрытие HTTP-клиента).
    stop_grace_period: 320s
    init: true
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
    # Порядок старта: сначала px6 (шлюз тянет из него список прокси) и
    # storage-service (всё хранилище: прокси, ключи, affinity, personas, лог).
    # Gateway к postgres напрямую не подключён и не должен: DSN знает только
    # storage-service. /health у px6 не ходит в апстрим, так что condition
    # безопасен; если px6 всё же упал — шлюз ретраит фетч через
    # PROXY_RETRY_SECONDS.
    depends_on:
      px6:
        condition: service_healthy
      storage-service:
        condition: service_healthy

  # --- web-admin: control plane (JSON API /api/admin/* + сессии в Redis).
  # Данными владеет шлюз; сюда ходит через его internal API с общим секретом.
  # Имя сервиса = DNS-имя в сети (web-admin:8000); на него ссылается
  # upstream в edge/nginx.conf — не переименовывать в одну сторону.
  web-admin:
    build: ./web-admin
    image: openroute-web-admin
    env_file:
      - ./web-admin/.env
    restart: unless-stopped
    init: true
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- web-admin-ui: React SPA (статика nginx), отдельный контейнер.
  # Секретов не получает: браузер ходит за данными в web-admin через edge.
  # Имя сервиса = DNS-имя (web-admin-ui:8080) для upstream в edge/nginx.conf.
  web-admin-ui:
    build: ./web-admin-ui
    image: openroute-web-admin-ui
    restart: unless-stopped
    init: true
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    # nginx-unprivileged слушает 8080 и работает от uid 101; capabilities не нужны.
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - net

  px6:
    build: ./px6-service
    image: openroute-px6
    # container_name задаёт DNS-имя в сети: шлюз ходит по
    # PROXIES_URL=http://openroute-px6:8000/proxies — не переименовывать.
    # Имя уникально для всего docker-демона и не конфликтует с NVRoute
    # (у того контейнер прокси-сервиса называется proxy6-service).
    container_name: openroute-px6
    env_file:
      - ./px6-service/.env
    # Хост-порт НЕ публикуем: /proxies отдаёт креды прокси в открытом виде.
    # Debug: docker run --rm --network openroute-net curlimages/curl \
    #   http://openroute-px6:8000/proxies
    restart: unless-stopped
    init: true
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net

networks:
  # Собственная (проектная, НЕ external) сеть OpenRoute: полностью изолирована
  # от соседних стеков (в NVRoute — своя service-net), DNS-имена и имена
  # контейнеров не пересекаются. Compose создаёт её сам — вручную создавать
  # не нужно (и не нужно подключать к ней чужие контейнеры).
  net:
    name: openroute-net

volumes:
  # Данные PostgreSQL (именованный том — переживает пересоздание контейнера
  # и `docker compose down`; удаляется только командой `down -v`).
  pgdata:
  # AOF Redis: сессии админки переживают рестарт контейнера Redis.
  redisdata:

# edge — единая точка входа OpenRoute (API Gateway-паттерн).
#
# Наружу торчит ТОЛЬКО этот контейнер (хост-порт OPENROUTE_EDGE_PORT, по
# умолчанию 53202). gateway, web-admin и web-admin-ui подключены к
# openroute-net; остальные внутренние сервисы — в private-сетях. Наружу их
# порты не публикуются вообще.
# /internal/* шлюза наружу НЕ проксируется никогда.

worker_processes auto;
events { worker_connections 1024; }

http {
    keepalive_timeout 75s;
    server_tokens off;

    # Редиректы (return 3xx /login и т.п.) — ОТНОСИТЕЛЬНЫЕ: без этого nginx
    # абсолютизирует Location портом контейнера (8000) и клиент уходит
    # на несуществующий адрес вместо порта стены (OPENROUTE_EDGE_PORT, 53202).
    absolute_redirect off;

    # Анти-DoS на уровне стены: лимит тела должен быть НЕ меньше лимита
    # шлюза (MAX_BODY_BYTES=20м), иначе nginx режет раньше и отдаёт 413
    # без понятного OpenAI-формата. Здесь — с запасом равным.
    client_max_body_size 21m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    # Тайминги под стримы: UPSTREAM_TIMEOUT=300 у шлюза, запас — 320s
    proxy_connect_timeout 10s;
    proxy_send_timeout 320s;
    proxy_read_timeout 320s;

    upstream gateway {
        server gateway:8000;
        keepalive 32;
    }

    # JSON API админки (сессии, снапшоты, мутации).
    upstream web_admin {
        server web-admin:8000;
        keepalive 8;
    }

    # React SPA (статика nginx, без секретов).
    upstream web_admin_ui {
        server web-admin-ui:8080;
        keepalive 8;
    }

    server {
        listen 8000;
        server_name _;

        # --- SPA-админка (control plane) ---
        location = / {
            return 307 /login;
        }

        # Все клиентские маршруты SPA отдают index.html; React Router
        # разбирает /login и /admin/* на клиенте.
        location = /login {
            proxy_pass http://web_admin_ui;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location = /admin {
            proxy_pass http://web_admin_ui;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # /admin/ui был временным пространством имён; страницы живут
        # непосредственно под /admin/.
        location /admin/ui {
            return 404;
        }

        location /admin/ {
            proxy_pass http://web_admin_ui;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location /assets/ {
            proxy_pass http://web_admin_ui;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location = /favicon.svg {
            proxy_pass http://web_admin_ui;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # --- JSON API админки ---
        # SSE-потоки: не буферизуем, иначе обновления залипают. Точные
        # location-блоки должны идти раньше общего /api/admin/.
        location = /api/admin/proxies/events {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
            proxy_buffering off;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /api/admin/keys/events {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
            proxy_buffering off;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/admin/ {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # --- API шлюза (data plane) ---
        location /v1/ {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
            # SSE: не буферизуем стримы, иначе chat-completions «залипает»
            proxy_buffering off;
            proxy_set_header Connection "";
        }

        # OpenAPI/Swagger шлюза (публичная документация API)
        location /openapi.json {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location /docs {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location = /health {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # /internal/* наружу НЕ существует — default ниже отдаст 404.
        location / {
            return 404;
        }
    }
}

# edge — единая точка входа OpenRoute (API Gateway-паттерн).
#
# Наружу торчит ТОЛЬКО этот контейнер (хост-порт OPENROUTE_EDGE_PORT, по
# умолчанию 53202). Все сервисы (gateway, web-admin) прячутся в
# docker-сети openroute-net; наружу их порты не публикуются вообще.
# /internal/* шлюза наружу НЕ проксируется никогда.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 75s;
    server_tokens off;

    # Редиректы (return 3xx /login и т.п.) — ОТНОСИТЕЛЬНЫЕ: без этого nginx
    # абсолютизирует Location портом контейнера (8000) и клиент уходит
    # на несуществующий адрес вместо порта стены (OPENROUTE_EDGE_PORT, 53202).
    absolute_redirect off;

    # Анти-DoS на уровне стены: лимит тела должен быть НЕ меньше лимита
    # шлюза (MAX_BODY_BYTES=20м), иначе nginx режет раньше и отдаёт 413
    # без понятного OpenAI-формата. Здесь — с запасом равным.
    client_max_body_size 21m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    # Тайминги под стримы: UPSTREAM_TIMEOUT=300 у шлюза, запас — 320s
    proxy_connect_timeout 10s;
    proxy_send_timeout 320s;
    proxy_read_timeout 320s;

    upstream gateway {
        server gateway:8000;
        keepalive 32;
    }

    upstream web_admin {
        server web-admin:8000;
        keepalive 8;
    }

    server {
        listen 8000;
        server_name _;

        # --- сайт-админка (control plane) ---
        location = / {
            return 307 /login;
        }

        location /login {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location /admin/ui {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # SSE-потоки админки: не буферизуем, иначе обновления залипают.
        location = /admin/ui/events {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location = /admin/ui/keys/events {
            proxy_pass http://web_admin;
            include /etc/nginx/proxy_params_edge.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # --- API шлюза (data plane) ---
        location /v1/ {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
            # SSE: не буферизуем стримы, иначе chat-completions «залипает»
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
        }

        # JSON-API админских ключей (Bearer, не путать с /admin/ui сайтом)
        location /admin/status {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location /admin/logs {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # OpenAPI/Swagger шлюза (публичная документация API)
        location /openapi.json {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location /docs {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        location = /health {
            proxy_pass http://gateway;
            include /etc/nginx/proxy_params_edge.conf;
        }

        # /internal/* наружу НЕ существует — default ниже отдаст 404.
        location / {
            return 404;
        }
    }
}

# Общие proxy-параметры edge: пробрасываем базовые заголовки, ничего не меняем.
# Host оставляем внутренним (upstream по имени), X-Forwarded-* шлюз
# сознательно игнорирует (HOP_HEADERS) — топология клиентов не уходит в апстрим.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
